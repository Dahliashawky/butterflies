<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f0e8">
<title>You're Invited… Butterflies Only</title>
<style>
:root{--paper:#f5eee5;--ink:#5d4038;--rose:#c77e7b;--blush:#f2c9c1;--gold:#e7c8a1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
body{background:radial-gradient(ellipse at 50% 18%,#fffaf4 0%,#f4e5d9 52%,#d9b9a7 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:-10%;pointer-events:none;background:radial-gradient(ellipse at 15% 25%,#e7a9a655,transparent 28%),radial-gradient(ellipse at 88% 70%,#f5d5b855,transparent 30%),linear-gradient(115deg,transparent 35%,#fff7e866 48%,transparent 61%);animation:sunbeam 12s ease-in-out infinite alternate;z-index:0}@keyframes sunbeam{to{transform:translateX(4%) rotate(2deg);opacity:.65}}
main{min-height:100svh;display:grid;place-items:center;padding:26px 16px;position:relative;overflow:hidden;z-index:2}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#b8aa9b 3px 4px);mix-blend-mode:multiply;z-index:10}
.petal{position:fixed;top:-12vh;left:var(--left);width:var(--size);height:calc(var(--size)*1.45);background:linear-gradient(135deg,#f5c5c0,#d98986);border-radius:90% 10% 80% 20%;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 3px #80574b30);animation:petalFall var(--duration) linear var(--delay) infinite;z-index:1}@keyframes petalFall{0%{transform:translate3d(0,-5vh,0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.45}100%{transform:translate3d(var(--drift),115vh,0) rotate(620deg);opacity:0}}
.scene{width:min(680px,100%);min-height:620px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.kicker{font:10px/1.4 Arial,sans-serif;text-transform:uppercase;letter-spacing:.34em;color:#77766b;margin:0 0 24px}
.envelope-wrap{width:min(440px,88vw);aspect-ratio:1.3;position:relative;perspective:1100px;filter:drop-shadow(0 22px 22px #544b3b20);margin-top:4px}
.envelope{position:absolute;inset:0}
.back{position:absolute;inset:0;background:linear-gradient(145deg,#fffaf2,#e9d9c9);border:1px solid #d9c4b6;border-radius:3px;box-shadow:inset 0 0 35px #c6a58b22}
.letter{position:absolute;left:8%;right:8%;top:6%;height:87%;background:radial-gradient(ellipse at 50% 15%,#fffdf7,#f4e2d9 78%);border:1px solid #e4cfc5;box-shadow:inset 0 0 40px #d9b7a633;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px 15px;transform:translateY(0);transition:transform 1.5s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.letter::before,.letter::after{content:"";position:absolute;width:115px;height:115px;border:1px solid #d6aaa1;border-radius:50%;opacity:.42}
.letter::before{top:-72px;left:-50px}.letter::after{bottom:-70px;right:-45px}
.letter .tiny{font:9px Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#77766b;margin-bottom:12px}
.letter .title{font-size:clamp(22px,5vw,34px);line-height:1.18;font-weight:400;max-width:290px}
.letter .title em{font-weight:400;color:#a66f68}
.flap{position:absolute;inset:0;background:linear-gradient(155deg,#fffaf2,#ead9ca);clip-path:polygon(0 0,100% 0,50% 57%);transform-origin:top center;transform:rotateX(0);transition:transform 1s cubic-bezier(.2,.7,.2,1);backface-visibility:hidden;z-index:5}
.left,.right,.bottom{position:absolute;inset:0;z-index:3}
.left{background:#f2e6da;clip-path:polygon(0 0,51% 52%,0 100%)}
.right{background:#ead8c9;clip-path:polygon(100% 0,51% 52%,100% 100%)}
.bottom{background:#fbf3e9;clip-path:polygon(0 100%,51% 48%,100% 100%)}
.seal{position:absolute;z-index:7;left:50%;top:51%;transform:translate(-50%,-50%);width:78px;height:78px;border:0;border-radius:50%;background:radial-gradient(circle at 32% 22%,#f3c4b6,#c57e78 53%,#8d514e);box-shadow:inset 0 0 0 4px #d19a92,inset 0 0 0 6px #a96b64,0 5px 9px #55414a35;color:#fff9f1;font-size:27px;cursor:pointer;transition:opacity .4s,transform .5s}
.seal span{display:block;font-size:9px;font-family:Arial,sans-serif;letter-spacing:.12em;margin-top:2px}
.instruction{margin:25px 0 0;font:10px Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#77766b;text-align:center;animation:pulse 2.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.scene.open .flap{transform:rotateX(180deg)}
.scene.open .seal{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.45) rotate(20deg)}
.scene.open .letter{transform:translateY(-45%)}
.scene.open .left,.scene.open .right,.scene.open .bottom{opacity:.18;transition:opacity .8s}
.butterfly{position:absolute;width:35px;height:27px;z-index:8;pointer-events:none;opacity:0;transform:scale(.2)}
.butterfly:before,.butterfly:after{content:"";position:absolute;top:0;width:17px;height:24px;background:linear-gradient(145deg,#ffe5d6,#d88e88 62%,#8d5551);border:1px solid #9b655c;box-shadow:inset 0 0 5px #fff3df}
.butterfly:before{left:0;border-radius:90% 10% 75% 20%;transform-origin:right bottom;background:radial-gradient(ellipse at 70% 70%,#fff0df 0 8%,transparent 9%),repeating-linear-gradient(55deg,transparent 0 5px,#f8d9c8 5px 5.8px),linear-gradient(145deg,#ffe5d5,#d88e88 68%,#9d625b)}
.butterfly:after{right:0;border-radius:10% 90% 20% 75%;transform-origin:left bottom;background:radial-gradient(ellipse at 30% 70%,#fff0df 0 8%,transparent 9%),repeating-linear-gradient(-55deg,transparent 0 5px,#f8d9c8 5px 5.8px),linear-gradient(215deg,#ffe5d5,#d88e88 68%,#9d625b)}
.butterfly i{position:absolute;z-index:2;left:16px;top:9px;width:3px;height:17px;background:#80564f;border-radius:4px}
.scene.open .letter{transition-delay:.15s}
.scene.open .butterfly{animation:fly 3.4s cubic-bezier(.15,.65,.3,1) forwards, wingBeat .24s ease-in-out infinite alternate}
.scene.open .b2{animation-delay:.12s}.scene.open .b3{animation-delay:.25s}.scene.open .b4{animation-delay:.38s}.scene.open .b5{animation-delay:.5s}
.b1{left:25%;top:48%}.b2{left:39%;top:50%}.b3{left:50%;top:49%}.b4{left:61%;top:50%}.b5{left:72%;top:48%}
@keyframes wingBeat{from{scale:1 .92}to{scale:1 1.06}}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.25) rotate(0)}15%{opacity:1}100%{opacity:.95;transform:translate(var(--x,0px),var(--y,-220px)) scale(1.25) rotate(var(--r,25deg))}}
.b1{--x:-130px;--y:-230px;--r:-35deg}.b2{--x:-75px;--y:-290px;--r:24deg}.b3{--x:10px;--y:-250px;--r:-20deg}.b4{--x:85px;--y:-310px;--r:35deg}.b5{--x:145px;--y:-215px;--r:-25deg}
.reveal{display:none;text-align:center;width:min(600px,100%);padding:24px 10px 50px;animation:rise 1.2s both}
.reveal.visible{display:block}
@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
.decor{height:85px;display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:20px}
.decor .butterfly-icon{font-size:35px;color:#c08079;display:inline-block;animation:flit 2.5s ease-in-out infinite}
.decor .butterfly-icon:nth-child(2){font-size:50px;animation-delay:.3s;color:#d09a91}
.decor .butterfly-icon:nth-child(3){animation-delay:.7s;color:#bd8d81}
@keyframes flit{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(10deg)}}
.reveal h1{text-shadow:0 3px 20px #b67b6820;font-size:clamp(35px,8vw,70px);font-weight:400;line-height:1.08;letter-spacing:-.035em;margin:0 auto 18px;max-width:580px}
.reveal h1 em{font-weight:400;color:#a66f68}
.reveal p{font:10px Arial,sans-serif;text-transform:uppercase;letter-spacing:.28em;color:#79756d}
.reset{border:1px solid #c6a69c;border-radius:999px;background:transparent;color:#805e55;padding:11px 19px;font:10px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;margin-top:25px}
.note{font:10px Arial,sans-serif;letter-spacing:.14em;color:#8b8379;text-align:center;margin:22px 0 0}
@media(max-width:480px){.scene{min-height:550px}.envelope-wrap{width:92vw}.seal{width:68px;height:68px}.instruction{font-size:9px}.reveal{padding-top:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="grain"></div>
<main>
  <div class="scene" id="scene">
    <p class="kicker">A little magic is fluttering your way</p>
    <div class="envelope-wrap" aria-label="Sealed invitation">
      <div class="envelope">
        <div class="back"></div>
        <div class="letter">
          <div class="tiny">A special invitation</div>
          <div class="title">You're Invited…<br><em>Butterflies Only</em></div>
        </div>
        <div class="left"></div><div class="right"></div><div class="bottom"></div>
        <div class="flap"></div>
        <button class="seal" id="seal" aria-label="Tap to open invitation">✧<span>OPEN</span></button>
      </div>
      <div class="butterfly b1"><i></i></div><div class="butterfly b2"><i></i></div>
      <div class="butterfly b3"><i></i></div><div class="butterfly b4"><i></i></div><div class="butterfly b5"><i></i></div>
    </div>
    <p class="instruction" id="instruction">Tap the seal to open your invitation</p>
  </div>
  <section class="reveal" id="reveal" aria-live="polite">
    <div class="decor"><span class="butterfly-icon">❧</span><span class="butterfly-icon">🦋</span><span class="butterfly-icon">❧</span></div>
    <h1>You're Invited…<br><em>Butterflies Only</em></h1>
    <p>Something beautiful is about to unfold</p>
    <button class="reset" id="reset">Close & replay</button>
    <div class="note">More details coming soon</div>
  </section>
</main>
<script>
const scene=document.getElementById('scene'), seal=document.getElementById('seal');
const reveal=document.getElementById('reveal'), instruction=document.getElementById('instruction');
const reset=document.getElementById('reset');
seal.addEventListener('click',()=>{
  if(scene.classList.contains('open')) return;
  scene.classList.add('open');
  instruction.textContent='A little something is on its way…';
  setTimeout(()=>{
    scene.style.display='none';
    reveal.classList.add('visible');
    window.scrollTo({top:0,behavior:'smooth'});
  },1700);
});
reset.addEventListener('click',()=>{
  reveal.classList.remove('visible');
  scene.style.display='flex';
  scene.classList.remove('open');
  instruction.textContent='Tap the seal to open your invitation';
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
<script>
// Ambient falling petals and floating butterflies are generated locally; no external assets required.
for(let i=0;i<18;i++){const p=document.createElement("span");p.className="petal";p.style.setProperty("--left",(Math.random()*100)+"vw");p.style.setProperty("--size",(7+Math.random()*13)+"px");p.style.setProperty("--duration",(10+Math.random()*15)+"s");p.style.setProperty("--delay",(-Math.random()*24)+"s");p.style.setProperty("--drift",(-80+Math.random()*160)+"px");document.body.appendChild(p)}
</script>
</body>
</html>
